[project]
name = "foci-analyzer"
version = "0.1.0.dev0"
description = "Detection, quantification and colocalization of foci in nuclei and cells (Python successor of the Foci Analyzer Fiji macro)"
readme = "README.md"
authors = [{ name = "Bram van den Broek" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "tifffile>=2024.8",
    "pandas>=2.2",
    "tomli-w>=1.0",
    "pylibczirw>=6.1.0; sys_platform != 'darwin' or platform_machine == 'arm64'",  # no package for Intel Macs
    "readlif>=0.6.6",
    "plotly>=7.1.0",
    "roifile>=2024.9",
]

[project.scripts]
foci-analyzer = "foci_analyzer.cli:main"

[project.gui-scripts]
foci-analyzer-window = "foci_analyzer.cli:main"  # the same, without a console window (the desktop shortcut)

# Extras for the deep-learning back-ends are added when their milestone starts (plan.md, section 9),
# after checking the versions that install together.

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foci_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"  # no .pytest_cache in the (synced) project folder

[tool.ruff]
cache-dir = "~/.cache/ruff/foci-analyzer"  # keep the cache out of the synced project folder
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["TRY004"]  # an unusable setting is always a ValueError, whatever is wrong with it
