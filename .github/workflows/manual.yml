# The user manual on GitHub Pages: published on every push to main that changes it, or by hand.
# Versions pinned: the ones built and checked locally (tools/manual/MAINTAINING.md, "Publish").
name: manual

on:
  push:
    branches: [main]
    paths: ["manual/**", "mkdocs.yml", ".github/workflows/manual.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.8.1 mkdocs-glightbox==0.5.3
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
